services:
  - type: web
    name: campusops-backend
    runtime: node
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/v1/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      - key: MONGO_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: LM_STUDIO_API_URL
        value: http://localhost:1234/v1
      - key: LM_STUDIO_API_KEY
        value: lm-studio
      - key: LM_STUDIO_MODEL
        value: llama-3.1-8b-instruct
